<!doctype html>
<html lang="es">
<head>

<title>Feria Los Tacariguas — Render</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd8e0; font-family: system-ui, Segoe UI, sans-serif; }
  #vista { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: 12px; left: 12px; width: 250px; padding: 12px 14px;
    background: rgba(20, 24, 28, .82); color: #eef1f4; border-radius: 10px; font-size: 13px;
    box-shadow: 0 4px 18px rgba(0,0,0,.25); user-select: none;
  }
  #panel h1 { font-size: 15px; margin: 0 0 2px; }
  #panel .sub { color: #aab4be; font-size: 11.5px; margin-bottom: 10px; }
  #panel .grupo { margin: 10px 0 4px; color: #aab4be; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  #panel button {
    background: #2f3a45; color: #eef1f4; border: 1px solid #45525f; border-radius: 6px;
    padding: 5px 8px; margin: 2px 2px 2px 0; font-size: 12.5px; cursor: pointer;
  }
  #panel button:hover { background: #3c4a58; }
  #panel button.principal { background: #1f6f4a; border-color: #2c8a5e; width: 100%; margin-top: 8px; padding: 7px; }
  #panel label { display: flex; align-items: center; gap: 6px; margin: 4px 0; cursor: pointer; }
  #panel input[type=range] { width: 100%; }
  #ayuda { position: fixed; bottom: 10px; left: 12px; color: #1d2329; font-size: 12px; background: rgba(255,255,255,.7); padding: 4px 8px; border-radius: 6px; }
  .etiqueta {

    font-size: 12px; font-weight: 600; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }

</style>
</head>
<body>
<div id="vista"></div>
<div id="panel">
  <h1>Feria · Los Tacariguas</h1>
  <div class="sub">106 aniversario AMB · Acto central</div>

  <div class="grupo">Vistas</div>
  <button data-vista="aerea">Aérea</button>

{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Tree } from 'ez-tree';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ================================================================
   DATOS DEL LEVANTE
   Todas las posiciones están en PÍXELES de la captura satelital
   (referencia_satelital.webp, 1181 x 667). Se convierten a metros
   con la escala S. Norte = arriba de la imagen.
   ================================================================ */
const S = 0.31;            // metros por píxel (medido contra Google Maps a zoom 19)
const ORIGEN = [595, 238]; // píxel que queda en (0,0,0): centro de la zona de trabajo
const IMG = [1181, 667];

// Carretera principal: eje central, de suroeste a noreste
const VIA_PRINCIPAL = [[-600,1460],[-200,1110],[150,800],[240,720],[305,650],[360,600],[415,548],[478,495],[535,447],[590,400],
  [645,352],[700,305],[757,258],[815,208],[870,160],[905,130],[950,103],[1000,85],[1050,72],[1100,63],
  [1181,55],[1300,50],[1450,47],[1800,44],[4000,40]];
const VIA_SUR = [[422,552],[452,588],[478,628],[497,667],[515,720]];        // ramal hacia el sur
const CAMINO_TIERRA = [[700,312],[735,336],[770,366],[800,395],[825,420],[842,442]];
const CAMINO_ESTE = [[1250,428],[1181,428],[1135,424],[1112,447],[1100,500],[1095,580],[1093,667],[1092,760]];

// Plataforma de concreto (todo lo que está al noroeste de la vía, menos el sembradío)
const PLATAFORMA = [[-900,1126],[1269,-900],[4000,-900],
  ...VIA_PRINCIPAL.slice().reverse().slice(0, -2), [240,720],[150,800],[-200,1100],[-900,1126]];
const SEMBRADIO = [[-3000,3087],[3731,-3200],[-3000,-3200]];
const GRAMA = [
  [[280,320],[345,318],[352,395],[288,398]],                 // jardín frente a hangares viejos
  [[345,420],[440,410],[462,470],[425,522],[352,522]],        // jardín de palmeras
];

/* Edificios. c = centro [px], L = largo (m), W = ancho (m), ang = giro del eje largo
   en grados (sentido horario sobre la imagen), h = altura de paredes (m),
   techo: 'dos_aguas' | 'cuatro_aguas' | 'plano', cumbre = altura extra del techo (m). */
const EDIFICIOS = [
  { id:'hangar', tipo:'hangar', nombre:'Hangar · Grupo de Entrenamiento Aéreo N°19', c:[507,274], L:53, W:26, ang:47.9, h:11.5, cumbre:0.5 },
  { id:'saag', nombre:'Servicio de Atención Aérea del Gobierno', c:[660,142], L:33, W:15, ang:-36.3, h:7.5, techo:'cuatro_aguas', cumbre:2.6,
    muro:'#e7e0cf', color:'#c66d55' },
  { id:'saag_anexo', nombre:'Anexo SAAG', c:[695,174], L:23, W:12, ang:-36.9, h:4.5, techo:'plano', muro:'#dcd8cf', color:'#b9bcbc' },
  { id:'saag_caseta', c:[690,82], L:5, W:4, ang:-36, h:3.5, techo:'plano', muro:'#8a8f93', color:'#5b6166' },
  { id:'anexo_oscuro', c:[427,272], L:16, W:9, ang:47.9, h:7, techo:'plano', muro:'#c9c6bd', color:'#4d5052' },
  { id:'anexo_marron', c:[383,286], L:18, W:12, ang:47.9, h:5, techo:'dos_aguas', cumbre:1.2, muro:'#cfc8b8', color:'#7d6a56' },
  { id:'anexo_blanco', c:[457,330], L:22, W:9, ang:47.9, h:4.8, techo:'dos_aguas', cumbre:1.6, muro:'#c7cbcf', color:'#dcdedf' },
  { id:'edif_verde', nombre:'Edificio verde', c:[405,371], L:21, W:15, ang:47.9, h:6, techo:'dos_aguas', cumbre:1.8,
    muro:'#dcd8cc', color:'#a6c08c' },
  { id:'edif_azul', c:[345,366], L:18, W:9, ang:47.9, h:7, techo:'plano', muro:'#cfcbc2', color:'#41474f' },
];

// Edificios vecinos (contexto, menos detalle)
const VECINOS = [
  { c:[275,470], L:46, W:22, ang:47.9, h:9, techo:'dos_aguas', cumbre:3, muro:'#d6d2c6', color:'#a3bb93' },
  { c:[195,552], L:46, W:22, ang:47.9, h:9, techo:'dos_aguas', cumbre:3, muro:'#d6d2c6', color:'#e1e1dc' },
  { c:[112,612], L:46, W:22, ang:47.9, h:9, techo:'dos_aguas', cumbre:3, muro:'#d6d2c6', color:'#8e3d33' },
  { c:[ 30,640], L:40, W:22, ang:47.9, h:9, techo:'dos_aguas', cumbre:3, muro:'#d6d2c6', color:'#c9c9c4' },
  { c:[275,398], L:14, W:8,  ang:47.9, h:5, techo:'dos_aguas', cumbre:1.2, muro:'#ddd8cc', color:'#d48a6c' },
  { c:[318,445], L:20, W:9,  ang:47.9, h:5, techo:'plano', muro:'#ddd8cc', color:'#e6e5e0' },
  { c:[915,266], L:34, W:15, ang:-3, h:6, techo:'plano', muro:'#cfcac0', color:'#9c9d99' },
  { c:[912,228], L:34, W:9,  ang:-3, h:7.5, techo:'plano', muro:'#c3beb5', color:'#55585b' },
  { c:[942,305], L:8,  W:9,  ang:0, h:4, techo:'plano', muro:'#cfcac0', color:'#8d8f8d' },
  { c:[986,305], L:5,  W:6,  ang:0, h:3, techo:'plano', muro:'#e6e3dc', color:'#f0efea' },
  { c:[890,468], L:28, W:12, ang:0, h:5, techo:'plano', muro:'#d9d6cf', color:'#c7c9c6' },
  { c:[889,513], L:28, W:13, ang:0, h:5, techo:'plano', muro:'#e3e1db', color:'#f2f2ef' },
  { c:[980,474], L:7,  W:10, ang:0, h:3.5, techo:'plano', muro:'#e3e1db', color:'#f2f2ef' },
  { c:[930,424], L:7,  W:4,  ang:0, h:3, techo:'plano', muro:'#cfcac0', color:'#a5a7a4' },
];

// Árboles [px, py, radio de copa en px]; palmeras [px, py]
const ARBOLES = [[645,285,22],[700,228,16],[752,212,16],[775,272,20],[745,300,14],[805,168,18],[843,135,14],
  [830,225,14],[885,178,20],[870,140,14],[495,388,20],[470,418,16],[518,425,16],[600,330,8],
  [410,640,22],[468,650,20],[530,640,18],[240,640,18],[1060,470,12],[1050,140,10]];
const PALMERAS = [[380,435],[395,470],[420,452],[410,500],[375,500],[432,488],[362,468],[398,520],[440,440]];

/* ================================================================
   ESCENA
   ================================================================ */
const px = (p) => new THREE.Vector3((p[0] - ORIGEN[0]) * S, 0, (p[1] - ORIGEN[1]) * S);
const rad = THREE.MathUtils.degToRad;
let semilla = 7; const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;

const cont = document.getElementById('vista');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.58;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
cont.appendChild(renderer.domElement);

const etiquetas = new CSS2DRenderer();
etiquetas.setSize(innerWidth, innerHeight);
Object.assign(etiquetas.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none' });
cont.appendChild(etiquetas.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbfcad6, 0.000045);   // bruma atmosférica

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 60000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = rad(88);
controls.minDistance = 5;
controls.maxDistance = 6000;

// Postproceso: sombras de contacto (oclusión ambiental) en esquinas y bajo objetos
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.updateGtaoMaterial({ radius: 1.6, distanceExponent: 1.5, thickness: 1.5, scale: 1, samples: 16 });
gtao.blendIntensity = 0.9;
composer.addPass(gtao);
composer.addPass(new OutputPass());
let usarAO = true, ultimoMov = 0;
controls.addEventListener('change', () => { ultimoMov = performance.now(); });

// Cielo real con nubes (Poly Haven, CC0). Sol del sureste, como en la imagen satelital (sombras hacia el noroeste)
const sol = new THREE.Vector3().setFromSphericalCoords(1, rad(90 - 52), rad(55));
scene.background = new THREE.Color(0xbfcad6);
const AJUSTE_CIELO = 1;   // si el sol del cielo no coincide con las sombras, cambiar a -1
new RGBELoader().setDataType(THREE.FloatType).load('assets/cielo/cielo_2k.hdr', (hdr) => {
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  const { data, width, height } = hdr.image;
  let mejor = -1, bi = 0;
  for (let i = 0; i < width * height; i++) { const l = data[i * 4] + data[i * 4 + 1] + data[i * 4 + 2]; if (l > mejor) { mejor = l; bi = i; } }
  const lonSolCielo = (((bi % width) + 0.5) / width - 0.5) * 2 * Math.PI;
  const giro = AJUSTE_CIELO * (lonSolCielo - Math.atan2(sol.z, sol.x));
  scene.background = hdr; scene.environment = hdr;
  scene.backgroundRotation.y = giro; scene.environmentRotation.y = giro;
  let r = 0, g = 0, b = 0, c = 0; const fila = Math.floor(height * 0.47);   // color del horizonte para la bruma
  for (let y = fila - 6; y < fila; y++) for (let x = 0; x < width; x += 4) { const k = (y * width + x) * 4; r += data[k]; g += data[k + 1]; b += data[k + 2]; c++; }
  scene.fog.color.setRGB(r / c, g / c, b / c);
  window.__cielo = { giro, lonSolCielo, fila: Math.floor(bi / width), height };
});

scene.add(new THREE.HemisphereLight(0xdfe9f2, 0x8a7d5c, 0.12));
const luz = new THREE.DirectionalLight(0xfff3e0, 2.8);
luz.position.copy(sol).multiplyScalar(400);
luz.castShadow = true;
luz.shadow.mapSize.set(4096, 4096);
Object.assign(luz.shadow.camera, { left: -230, right: 230, top: 230, bottom: -230, near: 10, far: 1000 });
luz.shadow.bias = -0.0004;
luz.shadow.normalBias = 0.4;
scene.add(luz, luz.target);

/* ---------- Materiales ---------- */
const cache = {};
function mat(color, extra = {}) {
  const k = color + JSON.stringify(extra);
  return cache[k] ??= new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0, envMapIntensity: 0.35, ...extra });
}

/* ---------- Texturas reales (Poly Haven, CC0) ---------- */
const cargador = new THREE.TextureLoader();
const cacheTex = {};
function tex(nombre, mapa, tile, srgb) {
  const k = nombre + mapa + tile;
  if (cacheTex[k]) return cacheTex[k];
  const t = cargador.load(`assets/texturas/${nombre}_${mapa}.jpg`);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / tile, 1 / tile); t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return cacheTex[k] = t;
}
// Material con textura real; las UV de la geometría deben estar en metros. tile = metros por repetición.
function pbr(nombre, tile, color = '#ffffff', extra = {}) {
  const k = 'pbr' + nombre + tile + color + JSON.stringify(extra);
  return cache[k] ??= new THREE.MeshStandardMaterial({ color, map: tex(nombre, 'det', tile, true),
    normalMap: tex(nombre, 'nor', tile), roughnessMap: tex(nombre, 'rough', tile), roughness: 1, envMapIntensity: 0.6, ...extra });
}
function uvMetros(geo) {   // UV = posición horizontal (x, −z) en metros
  const p = geo.attributes.position, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) { uv[i * 2] = p.getX(i); uv[i * 2 + 1] = -p.getZ(i); }
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); return geo;
}
function cajaMetros(geo, dx, dy, dz) {   // UV de una caja en metros por cara
  const uv = geo.attributes.uv, esc = [[dz, dy], [dz, dy], [dx, dz], [dx, dz], [dx, dy], [dx, dy]];
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) { const i = f * 4 + k; uv.setXY(i, uv.getX(i) * esc[f][0], uv.getY(i) * esc[f][1]); }
  return geo;
}

/* ---------- Terreno ---------- */
function poligono(puntos, y, material) {
  const forma = new THREE.Shape(puntos.map(p => { const v = px(p); return new THREE.Vector2(v.x, -v.z); }));
  const geo = new THREE.ShapeGeometry(forma);
  geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, material);
  m.position.y = y; m.receiveShadow = true;
  scene.add(m); return m;
}

const suelo = new THREE.Mesh(uvMetros(new THREE.CircleGeometry(1750, 96).rotateX(-Math.PI / 2)), pbr('campo', 6, '#a8a46c'));
suelo.receiveShadow = true; scene.add(suelo);
poligono(SEMBRADIO, 0.02, pbr('grama', 4, '#768f4f'));   // campo de grama (en temporada de lluvia)
poligono(PLATAFORMA, 0.03, pbr('apron', 5, '#b8b3a9'));
GRAMA.forEach(g => poligono(g, 0.04, pbr('grama', 2.5, '#6b8f3f')));

// Franjas (vías, caminos, rayas): cinta a lo largo de una curva suave
function curva(puntos) {
  return new THREE.CatmullRomCurve3(puntos.map(px), false, 'centripetal');
}
function cinta(curve, ancho, y, material, desplaz = 0, t0 = 0, t1 = 1, pasos = 300) {
  const pos = [], nor = [], uv = [], idx = [];
  const n = Math.max(2, Math.round(pasos * (t1 - t0))), Lc = curve.getLength();
  for (let i = 0; i <= n; i++) {
    const t = t0 + (t1 - t0) * i / n;
    const p = curve.getPointAt(t), d = curve.getTangentAt(t);
    const lado = new THREE.Vector3(d.z, 0, -d.x).normalize(); // hacia el noroeste en la vía principal
    const a = p.clone().addScaledVector(lado, desplaz - ancho / 2);
    const b = p.clone().addScaledVector(lado, desplaz + ancho / 2);
    pos.push(a.x, y, a.z, b.x, y, b.z); nor.push(0,1,0, 0,1,0); uv.push(0, t * Lc, ancho, t * Lc);
    if (i < n) { const k = i * 2; idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3); }   // cara hacia arriba
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  const m = new THREE.Mesh(geo, material);
  material.side = THREE.DoubleSide;
  m.receiveShadow = true; scene.add(m); return m;
}
function rayado(curve, ancho, y, material, desplaz, raya, hueco) {
  const L = curve.getLength();
  for (let s = 0; s < L; s += raya + hueco) cinta(curve, ancho, y, material, desplaz, s / L, Math.min(1, (s + raya) / L), 3);
}

const viaP = curva(VIA_PRINCIPAL);
cinta(viaP, 13, 0.06, pbr('apron', 4, '#c9c5bb'));            // hombrillos / acera
cinta(viaP, 9.5, 0.08, pbr('asfalto', 5, '#7c7c7a')); // asfalto
rayado(viaP, 0.15, 0.10, mat('#f2f0e8'), 0, 3, 5);  // raya central discontinua
cinta(viaP, 0.15, 0.10, mat('#f2f0e8'),  4.4);       // bordes continuos
cinta(viaP, 0.15, 0.10, mat('#f2f0e8'), -4.4);

const viaS = curva(VIA_SUR);
cinta(viaS, 8, 0.055, pbr('apron', 4, '#c9c5bb'));
cinta(viaS, 7, 0.075, pbr('asfalto', 5, '#7c7c7a'));
cinta(curva(CAMINO_TIERRA), 3.5, 0.05, pbr('tierra', 3, '#b9a17c'));
cinta(curva(CAMINO_ESTE), 4, 0.05, pbr('tierra', 3, '#b9a17c'));

/* ---------- Edificios ---------- */
function poliedro(caras) {
  const grupos = [[], []];
  caras.forEach(c => { for (let i = 1; i < c.v.length - 1; i++) grupos[c.m].push(...c.v[0], ...c.v[i], ...c.v[i + 1]); });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute([...grupos[0], ...grupos[1]], 3));
  geo.addGroup(0, grupos[0].length / 3, 0);
  geo.addGroup(grupos[0].length / 3, grupos[1].length / 3, 1);
  geo.computeVertexNormals();
  return geo;
}
function techo(o) {
  const ov = 0.5, a = o.L / 2 + ov, b = o.W / 2 + ov, h = o.h, r = o.cumbre ?? 0;
  if (o.techo === 'dos_aguas') return poliedro([
    { m:0, v:[[-a,h,-b],[a,h,-b],[a,h+r,0],[-a,h+r,0]] },
    { m:0, v:[[-a,h,b],[-a,h+r,0],[a,h+r,0],[a,h,b]] },
    { m:1, v:[[-o.L/2,h,-o.W/2],[-o.L/2,h+r,0],[-o.L/2,h,o.W/2]] },
    { m:1, v:[[o.L/2,h,-o.W/2],[o.L/2,h,o.W/2],[o.L/2,h+r,0]] },
  ]);

function palmera(g, x, z, alto, color, hojas = 9, largo = 3.2, ancho = 0.7) {
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.3, alto, 10), mat('#8d7d68', { roughness: 0.95 }));
  tr.position.set(x, alto / 2, z); tr.castShadow = true; g.add(tr);
  if (hojas < 16) { copaPalma(g, x, alto, z, hojas + 3, largo * 1.1, ancho * 1.6, 0.6); return; }
  const mh = mat(color, { flatShading: true, side: THREE.DoubleSide });
  for (let i = 0; i < hojas; i++) {
    const h = new THREE.Mesh(new THREE.ConeGeometry(ancho, largo, 4), mh);
    h.geometry.translate(0, largo / 2, 0);
    h.position.set(x, alto, z);
    h.rotation.set(0, i / hojas * Math.PI * 2, rad(50 + (i % 3) * 15), 'YXZ');
    h.scale.z = 0.2; g.add(h);

}

function construirHangar(o, g) {
  const hw = o.W / 2, x0 = -o.L / 2, x1 = o.L / 2, Hc = o.h, pe = 2.2;   // pe: forma del arco (2 = elipse)
  const verde = matLamina('#35b08c'), gris = matLamina('#5d6468'), blanco = pbr('friso', 2, '#f3f2ee');
  const acero = mat('#4e5a66', { metalness: 0.5, roughness: 0.5 }), oscuro = mat('#3c4246', { metalness: 0.3 });
  const amarillo = mat('#e3b92d');
  const zEn = (y) => hw * Math.pow(Math.max(0, 1 - Math.pow(y / Hc, pe)), 1 / pe);   // medio ancho del arco a la altura y
  const perfil = (n = 72) => {   // de z=+hw a z=−hw por encima
    const p = [];
    for (let k = 0; k <= n; k++) {
      const f = Math.PI * k / n, c = Math.cos(f), s = Math.sin(f);
      p.push([hw * Math.sign(c) * Math.pow(Math.abs(c), 2 / pe), Hc * Math.pow(Math.max(0, s), 2 / pe)]);
    }
    return p;
  };
  const bajo = (yMax, n = 24) => {   // parte del frente por debajo de yMax
    const d = [], iz = [];
    for (let k = 0; k <= n; k++) { const y = yMax * k / n; d.push([zEn(y), y]); iz.unshift([-zEn(y), y]); }
    return [...d, ...iz];
  };
  const muroFrente = (pts, x, material, agujero) => {
    const sh = new THREE.Shape(pts.map(([z, y]) => new THREE.Vector2(z, y)));
    const geo = new THREE.ShapeGeometry(sh); geo.rotateY(Math.PI / 2);
    const me = new THREE.Mesh(geo, material); me.position.x = x; g.add(me); return me;
  };

  // Bóveda de lámina verde (ondas siguiendo el arco)
  {
    const pf = perfil(), pos = [], uv = [], idx = [];
    let acc = 0;
    pf.forEach(([z, y], k) => {
      if (k) acc += Math.hypot(z - pf[k - 1][0], y - pf[k - 1][1]);
      pos.push(x0, y, z, x1, y, z); uv.push(0, acc, x1 - x0, acc);
      if (k < pf.length - 1) { const a = 2 * k; idx.push(a, a + 1, a + 3, a, a + 3, a + 2); }
    });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx); geo.computeVertexNormals();
    const ext = verde.clone(); ext.side = THREE.FrontSide;
    const int = matLamina('#a3abae'); int.side = THREE.BackSide;   // cara interior galvanizada
    g.add(new THREE.Mesh(geo, ext), new THREE.Mesh(geo, int));
    // bordes del arco y cumbrera con ventiladores
    for (const x of [x0 - 0.08, x1 + 0.08]) {
      const curva = new THREE.CatmullRomCurve3(pf.map(([z, y]) => new THREE.Vector3(x, y, z)));
      g.add(new THREE.Mesh(new THREE.TubeGeometry(curva, 90, 0.16, 6), oscuro));
    }
    caja(g, x1 - x0 + 0.3, 0.4, 1.0, 0, Hc + 0.22, 0, mat('#25866b', { roughness: 0.6 }));
    for (const x of [x1 - 2.5, 4, -12]) {
      const v = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.5, 12), mat('#b9bdbf', { metalness: 0.7, roughness: 0.35 }));
      v.position.set(x, Hc + 0.5, 0); g.add(v);
      const d = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), v.material);
      d.position.set(x, Hc + 0.75, 0); g.add(d);
    }
    // brocal amarillo en la base de ambos lados
    for (const s of [-1, 1]) caja(g, x1 - x0, 0.3, 0.35, 0, 0.15, s * (hw + 0.1), amarillo);
  }

  /* ----- Fachada principal (hacia la vía) ----- */
  const xf = x1;
  muroFrente(perfil(), xf, gris);
  muroFrente(bajo(3.9), xf + 0.03, blanco);
  muroFrente(bajo(0.5), xf + 0.05, mat('#a65f4a', { roughness: 0.6 }));          // zócalo de cerámica
  caja(g, 0.08, 3.1, 2.3, xf + 0.05, 1.55, 0, mat('#2f6a3a'));                  // marco con guirnalda
  caja(g, 0.1, 2.8, 1.8, xf + 0.08, 1.4, 0, mat('#26292c'));                    // puerta
  for (const z of [11.2, 8.8, 4.9, 1.6, -2.8, -6.3, -8.6, -10.9])                // ventanitas altas
    caja(g, 0.1, 0.6, 1.2, xf + 0.06, 3.35, z, mat('#1d2b4a', { roughness: 0.2, metalness: 0.4 }));
  { // escudo junto a la puerta
    const disco = (r, col, dx) => { const d = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.06, 32), mat(col)); d.rotation.z = Math.PI / 2; d.position.set(xf + dx, 1.95, 3.2); g.add(d); };
    disco(0.7, '#f4f4f2', 0.07); disco(0.52, '#1d3d7a', 0.1); disco(0.32, '#b3242b', 0.13);
  }
  const t1 = letrero('GRUPO DE ENTRENAMIENTO AEREO N°19', 9.5, 0.75);
  t1.rotation.y = Math.PI / 2; t1.position.set(xf + 0.1, 8.65, 0); g.add(t1);
  const v1 = valla(8.6, 3.62, true);
  v1.rotation.y = Math.PI / 2; v1.position.set(xf + 0.14, 5.45, -0.95); g.add(v1);
  caja(g, 0.1, 3.82, 8.8, xf + 0.08, 5.45, -0.95, oscuro);
  for (const [y, z] of [[8.6, 5.6], [8.6, -6.2], [7.4, 7.6], [6.3, -8.6]]) {      // reflectores
    caja(g, 0.8, 0.07, 0.07, xf + 0.4, y, z, oscuro);
    caja(g, 0.35, 0.25, 0.45, xf + 0.85, y - 0.1, z, mat('#2b2f33', { emissive: '#fff3d0', emissiveIntensity: 0.15 }));
  }
  for (let i = 0; i < 8; i++) {                                                   // poste rojo y blanco
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.97, 10), mat(i % 2 ? '#f2f2ef' : '#c0262c'));
    p.position.set(xf + 1.2, 0.48 + i * 0.97, -11.4); g.add(p);
  }

  // Plaza frente a la fachada: piso gris, caminería roja, bancos, jardín con palmeras
  g.add(quad([xf, 0.06, 7], [xf, 0.06, -13.5], [xf + 7.8, 0.06, 7], pbr('plaza', 3, '#8f979f')));
  g.add(quad([xf, 0.07, 0.9], [xf, 0.07, -0.9], [xf + 7.8, 0.07, -11.5], mat('#b4554a', { roughness: 0.8 })));
  g.add(quad([xf, 0.07, -11.5], [xf, 0.07, -13.5], [xf + 7.8, 0.07, -11.5], mat('#b4554a', { roughness: 0.8 })));
  for (const z of [5.5, -5.2, -8.8]) {
    caja(g, 0.5, 0.45, 2.0, xf + 1.5, 0.3, z, mat('#a8a8a4'));
  }
  g.add(quad([xf, 0.065, 17], [xf, 0.065, 7], [xf + 8, 0.065, 17], pbr('grama', 2.5, '#6b8f3f')));
  caja(g, 8, 0.25, 0.3, xf + 4, 0.12, 7, amarillo);
  [[1.2, 9, 1.0], [2.6, 9.6, 0.9], [1.4, 13, 1.1], [4.5, 15, 0.9], [6, 9, 0.8]].forEach(([x, z, r], i) => {   // setos
    const s = arbol(i % 2 ? 'Bush 1' : 'Bush 2', 3 + (i % 2), 0xb9d08f, r * 2.6, i * 1.7); s.position.set(xf + x, 0, z); g.add(s);
  });
  palmera(g, xf + 3.6, 11.5, 4.5, '#a7bcb7', 16, 2.8, 1.0);    // palma de Bismarck (plateada)
  palmera(g, xf + 1.3, 7.8, 3.5, '#4f8a3a', 8, 2.4, 0.5);      // palmas de jardín
  palmera(g, xf + 2.3, 8.6, 4.0, '#4f8a3a', 8, 2.4, 0.5);
  { // valla "Nido del Cóndor" en dos postes, esquina noreste
    const v2 = valla(2.6, 1.9); v2.rotation.y = Math.PI / 2 - 0.5; v2.position.set(xf + 6.5, 2.6, -16); g.add(v2);
    for (const dz of [-1.0, 1.0]) caja(g, 0.1, 2.6, 0.1, xf + 6.5 - dz * 0.48, 1.3, -16 + dz * 0.88, oscuro);
  }

  /* ----- Frente hacia la plataforma: portón corredizo (no hay fotos; supuesto) ----- */
  const ab = 10, hp = 7;   // medio ancho y alto del vano
  const ladoNO = [...perfil(), [-ab, 0], [-ab, hp], [ab, hp], [ab, 0]];
  muroFrente(ladoNO, x0, gris);
  caja(g, 0.5, 0.8, 2 * ab + 1, x0 - 0.25, hp + 0.4, 0, acero);
  const nh = 6, ah = (2 * ab) / nh, alto = hp - 0.1, vias = [0, 1, 2, 2, 1, 0];
  const matHoja = matLamina('#7c8994');
  const hojas = [];
  for (let i = 0; i < nh; i++) {
    const geo = new THREE.BoxGeometry(0.12, alto, ah + 0.08);
    const uv = geo.attributes.uv; for (let k = 0; k < uv.count; k++) uv.setXY(k, uv.getX(k) * (ah + 0.08), uv.getY(k) * alto);
    const hoja = new THREE.Mesh(geo, matHoja);
    caja(hoja, 0.16, 0.22, ah + 0.08, 0, -alto / 2 + 3.6, 0, acero);
    if (i === 1 || i === 4) caja(hoja, 0.16, 2.1, 1.0, 0, -alto / 2 + 1.05, 0, mat('#4a5560'));
    const zc = -ab + ah * (i + 0.5), za = (i < 3 ? -1 : 1) * (ab - ah / 2);
    hoja.position.set(x0 - 0.22 - vias[i] * 0.16, alto / 2 + 0.05, zc);
    hoja.userData = { zc, za };
    g.add(hoja); hojas.push(hoja);
  }
  caja(g, 0.45, 0.05, 2 * ab + 1, x0 - 0.35, 0.06, 0, mat('#3d4248'));
  for (const z of [-7, 0, 7]) caja(g, 0.35, 0.25, 0.45, x0 - 0.4, hp + 1.3, z, mat('#2b2f33', { emissive: '#fff3d0', emissiveIntensity: 0.15 }));
  // losa y línea guía en la plataforma
  g.add(quad([x0 - 30, 0.045, hw + 5], [x0 - 30, 0.045, -hw - 5], [x0, 0.045, hw + 5], pbr('apron', 5, '#b3aea4')));
  g.add(quad([x0 - 45, 0.055, 0.15], [x0 - 45, 0.055, -0.15], [x0 - 0.7, 0.055, 0.15], mat('#e2b631')));

  /* ----- Lado noreste: estacionamiento ----- */
  const raya = mat('#f1efe7');
  for (let k = 0; k <= 9; k++) caja(g, 0.12, 0.02, 5, -4 + 2.6 * k, 0.06, -hw - 3.2, raya);
  [[3, '#b8bcc0'], [7, '#7a1f22'], [8, '#f0f0ee']].forEach(([k, col]) => {
    const a = auto(col); a.rotation.y = Math.PI / 2; a.position.set(-4 + 2.6 * k + 1.3, 0.04, -hw - 3.1); g.add(a);
  });
  // Vehículos y motos bajo los mangos, junto a la vía (como en las fotos)
  [[22.5, -30, 'sedan', '#f2f2f0'], [22.5, -33.2, 'suv', '#2b2f33'], [22.5, -36.4, 'pickup', '#8e9296'], [22.5, -39.6, 'sedan', '#7a1f22']]
    .forEach(([x, z, t, c]) => { const a = autoReal(t, c); a.position.set(x, 0.04, z); g.add(a); });
  [[19.5, -19], [19.8, -20.6], [17.5, -23.5]].forEach(([x, z], i) => {
    const m = moto(['#1d3d7a', '#151515', '#b3242b'][i]); m.position.set(x, 0, z); m.rotation.y = Math.PI / 2 + i * 0.1; g.add(m);
  });

  /* ----- Interior (se ve con el portón abierto) ----- */
  g.add(quad([x0, 0.07, -hw + 0.3], [x1, 0.07, -hw + 0.3], [x0, 0.07, hw - 0.3], pbr('piso_hangar', 4, '#b2b6b1')));
  for (let x = x0 + 6; x < x1 - 1; x += 6) {
    const curva = new THREE.CatmullRomCurve3(perfil(36).map(([z, y]) => new THREE.Vector3(x, y * 0.985, z * 0.985)));
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curva, 40, 0.13, 5), acero));
  }
  const luces = [];
  for (const x of [-16, -2, 12]) {
    const l = new THREE.PointLight('#fff1d6', 0, 15, 1.2); l.position.set(x, 8.2, 0); g.add(l); luces.push(l);
    caja(g, 1.2, 0.15, 0.4, x, Hc - 2.2, 0, mat('#fffbe8', { emissive: '#fff4d0', emissiveIntensity: 0.6 }));
  }

  animables.push((dt) => {
    if (Math.abs(hangar.abierto - hangar.objetivo) < 1e-3) return;
    hangar.abierto += Math.sign(hangar.objetivo - hangar.abierto) * Math.min(Math.abs(hangar.objetivo - hangar.abierto), dt / 6);
    const t = hangar.abierto, e = t * t * (3 - 2 * t);
    hojas.forEach(h => { h.position.z = h.userData.zc + (h.userData.za - h.userData.zc) * e; });
    luces.forEach(l => { l.intensity = 60 * e; });
  });
}

function edificio(o, grupo) {
  const g = new THREE.Group();
  g.name = o.id ?? '';
  if (o.tipo === 'hangar') construirHangar(o, g);
  else {
    const muro = mat(o.muro), cubierta = mat(o.color, { roughness: 0.7 });
    const paredes = new THREE.Mesh(cajaMetros(new THREE.BoxGeometry(o.L, o.h, o.W), o.L, o.h, o.W), pbr('friso', 2.5, o.muro));
    paredes.position.y = o.h / 2;
    g.add(paredes);
    const geoT = techo(o);
    if (geoT) {
      g.add(new THREE.Mesh(geoT, [Object.assign(cubierta.clone(), { side: THREE.DoubleSide }), muro]));
    } else {
      const losa = new THREE.Mesh(new THREE.BoxGeometry(o.L + 0.3, 0.5, o.W + 0.3), cubierta);
      losa.position.y = o.h + 0.25; g.add(losa);
    }
  }
  g.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
  const c = px(o.c);
  g.position.set(c.x, 0, c.z);
  g.rotation.y = -rad(o.ang);
  grupo.add(g);
  if (o.nombre) {
    const div = document.createElement('div');
    div.className = 'etiqueta';
    div.innerHTML = `${o.nombre}<small>${o.L} × ${o.W} m · alto ${o.h + (o.cumbre ?? 0)} m</small>`;
    const et = new CSS2DObject(div);
    et.position.set(0, o.h + (o.cumbre ?? 0) + 4, 0);
    et.userData.esEtiqueta = true;
    g.add(et);
  }
  return g;
}

/* ---------- Relieve real alrededor de Maracay ----------
   Datos abiertos de elevación (mosaico Terrarium, zoom 11, ~75 m por píxel).
   Incluye la Cordillera de la Costa al norte, el Lago de Valencia y el mar Caribe. */
{
  const LAT = 10.246466, LON = -67.650342, Z = 11, TX = 638, TY = 964, N = 768;
  const n = 2 ** Z, lr = rad(LAT);
  const sx = ((LON + 180) / 360 * n - TX) * 256, sy = ((1 - Math.asinh(Math.tan(lr)) / Math.PI) / 2 * n - TY) * 256;
  const mpp = 40075016.686 * Math.cos(lr) / (n * 256);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = N;
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, N, N).data;
    const alt = (i, j) => { i = Math.max(0, Math.min(N - 1, i)); j = Math.max(0, Math.min(N - 1, j)); const k = (j * N + i) * 4; return d[k] * 256 + d[k + 1] + d[k + 2] / 256 - 32768; };
    const base = alt(Math.round(sx), Math.round(sy));
    const paso = 2, M = N / paso, pos = new Float32Array(M * M * 3), col = new Float32Array(M * M * 3), uv = new Float32Array(M * M * 2), idx = [];
    const cMar = new THREE.Color('#2f5870'), cValle = new THREE.Color('#a3a679'), cBosque = new THREE.Color('#4a6a3c'),
          cAlto = new THREE.Color('#3b5634'), cSeco = new THREE.Color('#a39466'), tmp = new THREE.Color();
    for (let j = 0; j < M; j++) for (let i = 0; i < M; i++) {
      const I = i * paso, J = j * paso, h = alt(I, J), x = (I - sx) * mpp, z = (J - sy) * mpp, r = Math.hypot(x, z);
      const f = THREE.MathUtils.smoothstep(r, 1600, 3800);
      const y = THREE.MathUtils.lerp(-0.6, Math.max(h, 0) - base, f);
      const k = j * M + i; pos.set([x, y, z], k * 3); uv.set([x / 40, -z / 40], k * 2);
      const pend = Math.hypot(alt(I + 1, J) - alt(I - 1, J), alt(I, J + 1) - alt(I, J - 1)) / (2 * mpp);
      if (h <= 0.5) tmp.copy(cMar);
      else {
        tmp.copy(cValle).lerp(cSeco, THREE.MathUtils.clamp((pend - 0.05) * 3, 0, 0.6));
        tmp.lerp(cBosque, THREE.MathUtils.smoothstep(h, 520, 800));
        tmp.lerp(cAlto, THREE.MathUtils.smoothstep(h, 1300, 2000));
        tmp.multiplyScalar(0.9 + 0.2 * Math.sin(x * 0.013 + Math.cos(z * 0.011) * 3) * Math.cos(z * 0.017));
      }
      col.set([tmp.r, tmp.g, tmp.b], k * 3);
      if (i < M - 1 && j < M - 1) idx.push(k, k + M, k + 1, k + 1, k + M, k + M + 1);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.setIndex(idx); geo.computeVertexNormals();
    const relieve = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, map: tex('grama', 'det', 1, true), roughness: 1, envMapIntensity: 0.5 }));
    relieve.receiveShadow = true; scene.add(relieve);
    const lago = new THREE.Mesh(new THREE.PlaneGeometry(N * mpp, N * mpp).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: '#4d6463', roughness: 0.12, metalness: 0.1, envMapIntensity: 1 }));

  caja(g, 0.5, 0.05, 1.3, -4.7, 1.7, 0, piel);
  const hr = helice(2, 1.5, mat('#2b2f33')); hr.rotation.y = Math.PI / 2; hr.position.set(-5.7, 1.9, 0.18); g.add(hr);
  caja(g, 0.25, 0.45, 0.25, 0.3, 2.6, 0, mat('#3a3f44'));
  for (let i = 0; i < 3; i++) {
    const pala = new THREE.Mesh(new THREE.BoxGeometry(4.9, 0.05, 0.22).translate(2.45, 0, 0), mat('#2b2f33'));
    pala.position.set(0.3, 2.85, 0); pala.rotation.y = i * Math.PI * 2 / 3 + 0.4; g.add(pala);
  }
  for (const s of [-1, 1]) {
    const patin = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3.0, 8).rotateZ(Math.PI / 2), mat('#3a3f44')); patin.position.set(0.2, 0.08, s * 0.95); g.add(patin);
    for (const x of [-0.5, 1.0]) caja(g, 0.06, 0.6, 0.06, x, 0.38, s * 0.85, mat('#3a3f44'));
  }
  return g;
}

const EXHIBICION = [
  [y8f, 950, 258], [DA42, 733, 278], [SF260, 1160, 272],
  [SF260, 660, 380], [enstrom, 740, 380], [enstrom, 805, 380], [enstrom, 860, 380], [DA40, 920, 380],

];
EXHIBICION.forEach(([fab, X, Y]) => { const a = fab(), [x, z] = PL(X, Y); a.position.set(x, 0, z); acto.add(a); });
{ // conos de seguridad en puntas de ala, proa y cola (modelo Kenney, CC0)
  const ESPACIO = { y8f: [19.6, 17.9], DA42: [7.1, 4.7], DA40: [6.4, 4.4], SF260: [4.6, 4.0], enstrom: [0, 3.6] }, conos = [];

  new GLTFLoader().load('assets/modelos/cone.glb', (gl) => {
    const base = gl.scene, b = new THREE.Box3().setFromObject(base);

    conos.forEach(([x, z]) => { const c = base.clone(); c.position.set(x, 0, z); acto.add(c); });
  });
}

/* ---------- Stands de PROYECTOS dentro del hangar ---------- */
{
  const panel = mat('#f4f4f2'), alfombra = mat('#2c4a86', { roughness: 1 });
  const grafica = ['#2f6fb0', '#2f8a5a', '#b0532f', '#6a4fa0', '#2f8a8a', '#a08a2f', '#8a2f4f'];
  let n = 1;
  for (const s of [1, -1]) for (let k = 0; k < 7; k++) {

    caja(acto, 5.8, 2.5, 0.08, x, 1.25, s * 7, panel);
    caja(acto, 5.2, 1.6, 0.02, x, 1.45, s * 6.95, mat(grafica[k]));
    caja(acto, 0.08, 2.5, 5, x - 2.9, 1.25, s * 4.5, panel);
    if (k === 6) caja(acto, 0.08, 2.5, 5, x + 2.9, 1.25, s * 4.5, panel);
    caja(acto, 5.8, 0.45, 0.08, x, 2.75, s * 2, mat('#1d4f9a'));
    const r = rotulo('PROYECTO ' + n, 5.6, 0.42, '#1d4f9a'); r.rotation.y = s > 0 ? Math.PI : 0; r.position.set(x, 2.75, s * 1.95); acto.add(r);
    caja(acto, 2, 0.95, 0.6, x, 0.475, s * 3.2, mat('#ececec'));
    persona(x + 0.6, s * 3.9, elegir(['#4b5a3a', '#1f2f5a', '#5a6146']));
    if (azar() < 0.6) persona(x - 1 + azar() * 2, s * (0.6 + azar() * 0.8), elegir(CIVILES));
    n++;
  }
}

/* ---------- Construir personas y sillas (instancias) ---------- */
const PERS = {};
{
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3(), col = new THREE.Color();
  // Figura humana de 1,76 m (origen en los pies, mirando hacia +x): uniforme y piel por separado
  const pieza = (geo, x, y, z) => geo.translate(x, y, z);
  const geoUniforme = mergeGeometries([
    pieza(new THREE.CylinderGeometry(0.075, 0.062, 0.86, 8), 0, 0.43, 0.1), pieza(new THREE.CylinderGeometry(0.075, 0.062, 0.86, 8), 0, 0.43, -0.1),
    pieza(new THREE.CapsuleGeometry(0.17, 0.32, 4, 10).scale(0.7, 1, 1.1), 0, 1.16, 0),
    pieza(new THREE.CylinderGeometry(0.05, 0.042, 0.62, 6), 0, 1.13, 0.245), pieza(new THREE.CylinderGeometry(0.05, 0.042, 0.62, 6), 0, 1.13, -0.245),
    pieza(new THREE.CylinderGeometry(0.115, 0.115, 0.07, 12), 0, 1.73, 0), pieza(new THREE.BoxGeometry(0.1, 0.015, 0.16), 0.11, 1.7, 0),
  ]);
  const geoPiel = mergeGeometries([
    pieza(new THREE.SphereGeometry(0.105, 12, 10).scale(1, 1.12, 0.92), 0, 1.6, 0), pieza(new THREE.CylinderGeometry(0.048, 0.05, 0.1, 8), 0, 1.47, 0),
    pieza(new THREE.SphereGeometry(0.045, 6, 5), 0, 0.8, 0.25), pieza(new THREE.SphereGeometry(0.045, 6, 5), 0, 0.8, -0.25),
  ]);
  const cuerpos = new THREE.InstancedMesh(geoUniforme, new THREE.MeshStandardMaterial({ roughness: 0.85, envMapIntensity: 0.3 }), personas.length);
  const cabezas = new THREE.InstancedMesh(geoPiel, new THREE.MeshStandardMaterial({ roughness: 0.65, envMapIntensity: 0.3 }), personas.length);
  personas.forEach(([x, z, y, c, sy], i) => {
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), (azar() - 0.5) * 0.15);
    sc.set(1, sy, 1); p.set(x, sy < 1 ? y - 0.35 : y, z); m4.compose(p, q, sc);
    cuerpos.setMatrixAt(i, m4); cuerpos.setColorAt(i, col.set(c));
    cabezas.setMatrixAt(i, m4); cabezas.setColorAt(i, col.set(elegir(['#8d6248', '#a5775a', '#6e4a36', '#c0927a'])));
  });
  q.identity();
  const sillasM = new THREE.InstancedMesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), new THREE.MeshStandardMaterial({ roughness: 0.6 }), sillas.length);
  sillas.forEach(([x, y, z, c], i) => { p.set(x, y + 0.225, z); m4.compose(p, q, sc.set(1, 1, 1)); sillasM.setMatrixAt(i, m4); sillasM.setColorAt(i, col.set(c)); });
  [cuerpos, cabezas, sillasM].forEach(m => { m.castShadow = true; m.receiveShadow = true; acto.add(m); });
  PERS.cuerpos = cuerpos; PERS.cabezas = cabezas;
  PERS.matrices = personas.map((_, i) => { const m = new THREE.Matrix4(); cuerpos.getMatrixAt(i, m); return m; });
}
acto.traverse(m => { if (m.isMesh && !m.isInstancedMesh) { m.castShadow = true; m.receiveShadow = true; } });
let actualizarPersonas = () => {};

/* ---------- Personas realistas cerca de la cámara ----------
   Modelos "Soldier" y "Michelle" (personajes Mixamo incluidos en los ejemplos de three.js).
   Se fijan en una pose (de pie o sentados) y se usan para las personas más cercanas a la cámara;
   las lejanas quedan como figura simple (no se notan a distancia y así la escena no se pone lenta). */
{
  const DIST = 80, CUPO = { soldado: 170, soldadoS: 130, civil: 40, civilS: 110 };
  const Y = new THREE.Vector3(0, 1, 0), vec = new THREE.Vector3(), m4 = new THREE.Matrix4(), uno = new THREE.Vector3(1, 1, 1), col = new THREE.Color();
  const qPi = new THREE.Quaternion().setFromAxisAngle(Y, Math.PI), m0 = new THREE.Matrix4().makeScale(0, 0, 0);
  const giros = personas.map(() => new THREE.Quaternion().setFromAxisAngle(Y, (azar() - 0.5) * 0.15));
  const cargar = (url) => new Promise((ok, mal) => new GLTFLoader().load(url, ok, undefined, mal));
  const hueso = (raiz, n) => raiz.getObjectByName('mixamorig' + n) ?? raiz.getObjectByName('mixamorig:' + n);

  function hornearMalla(m) {   // aplica la pose del esqueleto a los vértices
    const g = m.geometry.clone(), pos = g.attributes.position, nor = g.attributes.normal;
    if (m.isSkinnedMesh) {
      m.skeleton.update();
      const si = g.attributes.skinIndex, sw = g.attributes.skinWeight, huesos = m.skeleton.bones, inv = m.skeleton.boneInverses;
      const M = new THREE.Matrix4(), T = new THREE.Matrix4(), F = new THREE.Matrix4(), N3 = new THREE.Matrix3(), v = new THREE.Vector3(), n = new THREE.Vector3();
      const pre = new THREE.Matrix4().multiplyMatrices(m.matrixWorld, m.bindMatrixInverse);
      for (let i = 0; i < pos.count; i++) {
        M.elements.fill(0);
        for (let k = 0; k < 4; k++) {
          const w = sw.getComponent(i, k); if (!w) continue;
          const b = si.getComponent(i, k); T.multiplyMatrices(huesos[b].matrixWorld, inv[b]);
          for (let e = 0; e < 16; e++) M.elements[e] += T.elements[e] * w;
        }
        F.multiplyMatrices(pre, M).multiply(m.bindMatrix);
        v.fromBufferAttribute(pos, i).applyMatrix4(F); pos.setXYZ(i, v.x, v.y, v.z);
        if (nor) { N3.getNormalMatrix(F); n.fromBufferAttribute(nor, i).applyMatrix3(N3).normalize(); nor.setXYZ(i, n.x, n.y, n.z); }
      }
    } else g.applyMatrix4(m.matrixWorld);
    for (const a of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(a)) g.deleteAttribute(a);
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(pos.count * 2), 2));
    g.morphAttributes = {};
    return g;
  }
  function figura(gltf, clip, sentado, brazos) {
    const raiz = SkeletonUtils.clone(gltf.scene);
    raiz.updateMatrixWorld(true);
    const c = clip && gltf.animations.find(a => a.name === clip);
    if (c) { const mx = new THREE.AnimationMixer(raiz); mx.clipAction(c).play(); mx.update(0); }
    if (brazos) { hueso(raiz, 'LeftArm')?.rotateX(brazos); hueso(raiz, 'RightArm')?.rotateX(brazos); }   // brazos abajo (desde la pose en T)
    if (sentado) for (const l of ['Left', 'Right']) { hueso(raiz, l + 'UpLeg')?.rotateX(-1.45); hueso(raiz, l + 'Leg')?.rotateX(1.5); }
    raiz.updateMatrixWorld(true);
    const geos = [], mats = [];
    raiz.traverse(m => { if (m.isMesh) { geos.push(hornearMalla(m)); mats.push(m.material); } });
    const todos = geos.every(g => g.index) ? geos : geos.map(g => g.index ? g.toNonIndexed() : g);
    return { geo: mergeGeometries(todos, true), mats, cadera: hueso(raiz, 'Hips').getWorldPosition(new THREE.Vector3()) };
  }
  function matPersona(o, tela) {   // tela: la ropa toma el color del uniforme; la piel se conserva
    const m = new THREE.MeshStandardMaterial({ map: o.map ?? null, normalMap: o.normalMap ?? null, roughness: 0.8, metalness: 0, envMapIntensity: 0.5 });
    m.onBeforeCompile = (sh) => {
      sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', `
        #ifdef USE_COLOR
          float piel = smoothstep(0.04, 0.09, diffuseColor.r - diffuseColor.g) * smoothstep(0.015, 0.05, diffuseColor.g - diffuseColor.b) * (1.0 - smoothstep(0.3, 0.4, diffuseColor.r - diffuseColor.b));
          ${tela ? 'float lum = dot(diffuseColor.rgb, vec3(0.299, 0.587, 0.114)); diffuseColor.rgb = vColor * (0.4 + 1.6 * lum);   // el modelo de soldado no muestra piel (casco con visor)'
                 : 'diffuseColor.rgb *= mix(vColor, vec3(1.0), piel);'}
        #endif`);
    };
    m.customProgramCacheKey = () => 'persona' + tela;
    return m;
  }

  const altos = {};
  let listo = false, reloj = null;
  const mundo = () => { acto.updateMatrixWorld(); return personas.map(([x, z, y]) => acto.localToWorld(new THREE.Vector3(x, y, z))); };
  let posMundo = null;
  function actualizar() {
    if (!listo) return;
    posMundo ??= mundo();
    const cam = camera.position, n = { soldado: 0, soldadoS: 0, civil: 0, civilS: 0 }, elegidos = new Uint8Array(personas.length);
    if (acto.visible) {
      const orden = [];
      posMundo.forEach((w, i) => { const d = w.distanceToSquared(cam); if (d < DIST * DIST) orden.push([d, i]); });
      orden.sort((a, b) => a[0] - b[0]);
      for (const [, i] of orden) {
        const [x, z, y, c, sy] = personas[i], sent = sy < 1, k = (CIVILES.includes(c) ? 'civil' : 'soldado') + (sent ? 'S' : '');
        if (n[k] >= CUPO[k]) continue;
        vec.set(x, sent ? y - 0.22 : y, z);
        m4.compose(vec, sent ? qPi : giros[i], uno);
        altos[k].setMatrixAt(n[k], m4);
        altos[k].setColorAt(n[k], sent && CIVILES.includes(c) ? col.set(c).lerp(new THREE.Color(1, 1, 1), 0.55) : col.set(c));
        n[k]++; elegidos[i] = 1;
      }
    }
    for (const k in altos) { altos[k].count = n[k]; altos[k].instanceMatrix.needsUpdate = true; altos[k].instanceColor.needsUpdate = true; }
    personas.forEach((_, i) => { const m = elegidos[i] ? m0 : PERS.matrices[i]; PERS.cuerpos.setMatrixAt(i, m); PERS.cabezas.setMatrixAt(i, m); });
    PERS.cuerpos.instanceMatrix.needsUpdate = PERS.cabezas.instanceMatrix.needsUpdate = true;
  }
  actualizarPersonas = () => { clearTimeout(reloj); reloj = setTimeout(actualizar, 120); };
  controls.addEventListener('change', actualizarPersonas);

  Promise.all([cargar('assets/modelos/soldado.glb'), cargar('assets/modelos/civil.glb')]).then(([sold, civ]) => {
    const preparar = (gltf, clip, brazos, tela, clave, giro) => {
      const de = figura(gltf, clip, false, brazos), se = figura(gltf, clip, true, brazos);
      de.geo.computeBoundingBox();
      const s = 1.74 / (de.geo.boundingBox.max.y - de.geo.boundingBox.min.y);
      for (const [f, k] of [[de, clave], [se, clave + 'S']]) {
        f.geo.computeBoundingBox();
        f.geo.translate(-f.cadera.x, -f.geo.boundingBox.min.y, -f.cadera.z).scale(s, s, s).rotateY(giro);   // queda mirando hacia +x
        const im = new THREE.InstancedMesh(f.geo, f.mats.map(o => matPersona(o, tela)), CUPO[k]);
        im.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(CUPO[k] * 3), 3);
        im.count = 0; im.castShadow = im.receiveShadow = true; im.frustumCulled = false;
        acto.add(im); altos[k] = im;
      }
    };
    preparar(sold, 'Idle', 0, true, 'soldado', -Math.PI / 2);   // este modelo viene mirando hacia -z
    preparar(civ, null, 1.2, false, 'civil', Math.PI / 2);      // este viene mirando hacia +z
    listo = true; actualizar();
  }).catch(e => console.error('Personas realistas:', e));
}

{ // vistas del acto
  acto.updateMatrixWorld();
  const w = (x, y, z) => acto.localToWorld(new THREE.Vector3(x, y, z)).toArray();
  const [tx, tz] = PL(940, 595);
  VISTAS.acto = { pos: w(-150, 45, -105), mira: w(-20, 0, -165) };
  VISTAS.tribuna = { pos: w(tx - 6, 4.3, tz + 6), mira: w(tx - 80, 2, tz - 4) };
  VISTAS.proyectos = { pos: w(-32, 2.2, 3), mira: w(10, 1.6, 0) };
}
hangar.objetivo = 1;   // el día del acto el portón está abierto

irA('aerea');

const $ = (id) => document.getElementById(id);
$('chkCalco').onchange = e => { calco.visible = e.target.checked; };
$('opCalco').oninput = e => { calco.material.opacity = +e.target.value; if (!calco.visible) { calco.visible = true; $('chkCalco').checked = true; } };
$('chkNombres').onchange = e => scene.traverse(o => { if (o.userData.esEtiqueta) o.visible = e.target.checked; });
$('chkPorton').onchange = e => { hangar.objetivo = e.target.checked ? 1 : 0; };
$('chkActo').onchange = e => { acto.visible = e.target.checked; actualizarPersonas(); };
$('chkAO').onchange = e => { usarAO = e.target.checked; };
$('chkContexto').onchange = e => { grupoVecinos.visible = e.target.checked; };

$('btnFoto').onclick = () => {
  const prev = renderer.getPixelRatio();
  const alta = Math.min(4, prev * 2);
  renderer.setPixelRatio(alta); composer.setPixelRatio(alta);
  renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight);
  usarAO ? composer.render() : renderer.render(scene, camera);
  renderer.domElement.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `feria_tacariguas_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.png`;
    a.click();
    renderer.setPixelRatio(prev); composer.setPixelRatio(prev); renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight);
  }, 'image/png');
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); etiquetas.setSize(innerWidth, innerHeight);
});

const reloj = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(reloj.getDelta(), 0.1);
  animables.forEach(f => f(dt));
  controls.update();
  if (usarAO && performance.now() - ultimoMov > 350) composer.render(); else renderer.render(scene, camera);   // vista rápida mientras se mueve
  etiquetas.render(scene, camera);
});
window.__escena = { scene, camera, controls, irA, hangar, acto, renderer, luz };
